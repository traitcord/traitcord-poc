[package]
name = "poc_ui_demo"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
gpui = { path = "../../zed/crates/gpui", default-features = false }
gpui_platform = { path = "../../zed/crates/gpui_platform", default-features = false }
poc_ui = { path = "../crates/poc_ui" }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { path = "../../zed/crates/gpui_platform", default-features = false, features = ["font-kit", "runtime_shaders"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { path = "../../zed/crates/gpui_platform", default-features = false, features = ["x11", "wayland"] }

[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

[dev-dependencies]
gpui = { path = "../../zed/crates/gpui", default-features = false, features = ["test-support"] }
