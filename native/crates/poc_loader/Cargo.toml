[package]
name = "poc_loader"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# The modloader itself: injected into the GPUI host process.
[lib]
name = "poc_loader"
crate-type = ["cdylib"]
path = "src/poc_loader.rs"

[target.'cfg(target_os = "macos")'.dependencies]
poc_ui = { path = "../poc_ui" }
libloading = "=0.8.9"
